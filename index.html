<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Kasir Makanan Interaktif</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f8f9fa; color: #333; }
        h1, h2 { color: #2c3e50; }
        .container { display: flex; gap: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; min-width: 300px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input { width: 90%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button:hover { background: #218838; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .total { font-size: 1.2em; font-weight: bold; color: #e74c3c; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🍔 Aplikasi Kasir Makanan</h1>

    <div class="container">
        <!-- Form Input Kasir -->
        <div class="card">
            <h2>Ketik / Input Pesanan</h2>
            <div class="form-group">
                <label>Nama Makanan / Minuman:</label>
                <input type="text" id="namaMenu" placeholder="Contoh: Nasi Goreng Extra Pedas">
            </div>
            <div class="form-group">
                <label>Harga Satuan (Rp):</label>
                <input type="number" id="hargaMenu" placeholder="Contoh: 15000">
            </div>
            <div class="form-group">
                <label>Jumlah (Porsi/Gelas):</label>
                <input type="number" id="jumlahMenu" placeholder="Contoh: 2" value="1">
            </div>
            <button onclick="tambahPesanan()">+ Tambahkan ke Struk</button>
        </div>

        <!-- Daftar Struk / Keranjang Belanja -->
        <div class="card">
            <h2>Daftar Pesanan</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nama Item</th>
                        <th>Harga</th>
                        <th>Qty</th>
                        <th>Subtotal</th>
                    </tr>
                </thead>
                <tbody id="tabelPesanan">
                    <!-- Item yang diketik akan muncul di sini -->
                </tbody>
            </table>
            <div class="total">Total Bayar: Rp <span id="totalBayar">0</span></div>
        </div>
    </div>

    <script>
        let total = 0;

        function tambahPesanan() {
            const nama = document.getElementById('namaMenu').value;
            const harga = parseFloat(document.getElementById('hargaMenu').value);
            const qty = parseInt(document.getElementById('jumlahMenu').value);

            if (!nama || isNaN(harga) || isNaN(qty) || qty <= 0) {
                alert('Silakan ketik nama menu, harga, dan jumlah yang valid!');
                return;
            }

            const subtotal = harga * qty;
            total += subtotal;

            const tabel = document.getElementById('tabelPesanan');
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${nama}</td>
                <td>Rp ${harga.toLocaleString('id-ID')}</td>
                <td>${qty}</td>
                <td>Rp ${subtotal.toLocaleString('id-ID')}</td>
            `;
            tabel.appendChild(row);

            document.getElementById('totalBayar').innerText = total.toLocaleString('id-ID');

            // Reset form input setelah mengetik
            document.getElementById('namaMenu').value = '';
            document.getElementById('hargaMenu').value = '';
            document.getElementById('jumlahMenu').value = '1';
        }
    </script>

</body>
</html>
